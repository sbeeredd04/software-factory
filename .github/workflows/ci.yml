name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned ruff for gate reproducibility; keep in sync with scripts/check_all.sh.
  SF_RUFF_VERSION: "0.17.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (the static gate uses uvx-based checks)
        run: python3 -m pip install uv
      - name: Select runner Chrome for sandboxed Mermaid rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! chrome_path="$(command -v google-chrome)" || ! test -x "$chrome_path"; then
            printf 'error: Linux runner requires an executable google-chrome for Mermaid rendering\n' >&2
            exit 1
          fi
          printf 'Mermaid browser: %s\n' "$chrome_path"
          "$chrome_path" --version
          printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Smoke-test sandboxed Mermaid rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'flowchart TD\n  A --> B\n' > "$RUNNER_TEMP/sf-mermaid-smoke.mmd"
          python3 scripts/check_mermaid.py "$RUNNER_TEMP/sf-mermaid-smoke.mmd"
      - name: Byte-compile shipped Python
        run: python3 -m compileall -q install.py scripts skills tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Static gate
        run: bash scripts/check_all.sh
