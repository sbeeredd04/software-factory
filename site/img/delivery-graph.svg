<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Software Factory: orchestration, parallel delivery and feedback</title>
  <desc id="cycle-desc">An illustrative system, executed by the active coding host. An orchestrator spans planning, concurrent story work, independent proof and single-owner delivery. Failed or unknown proof returns to repair or replanning. Authorized feedback returns to triage. Human decisions are conditional at any phase. Shared records preserve context and evidence. The system-map fragment expands bug, recovery and improvement routes.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#365a40" stroke-width="1.6"/></marker>
    <marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a13f23" stroke-width="1.6"/></marker>
  </defs>
  <view id="system-map" viewBox="0 660 1440 1080"/>
