    <path d="M730 304H765" fill="none" stroke="#365a40" stroke-width="2" marker-end="url(#green-arrow)"/>
    <text x="36" y="244" font-size="25" font-weight="600" fill="#252820">Ground + plan</text>
    <text x="36" y="284" font-size="22" fill="#252820">BMad stories</text>
    <text x="36" y="315" font-size="20" fill="#252820">ACs · dependencies</text>
    <text x="36" y="354" font-size="22" fill="#252820">Plan review ↺</text>
    <text x="36" y="400" font-size="21" fill="#252820">→ Ready frontier</text>
    <text x="286" y="244" font-size="25" font-weight="600" fill="#252820">Parallel work</text>
    <rect x="284" y="264" width="182" height="44" rx="8" fill="#f4f1e9" stroke="#b1b7a4"/>
    <text x="295" y="293" font-size="21" fill="#252820">Story A · build</text>
    <rect x="284" y="321" width="182" height="44" rx="8" fill="#f4f1e9" stroke="#b1b7a4"/>
    <text x="295" y="350" font-size="21" fill="#252820">Story B · build</text>
    <text x="286" y="400" font-size="21" fill="#252820">Claim · self-test</text>
    <text x="536" y="244" font-size="25" font-weight="600" fill="#252820">Independent</text>
