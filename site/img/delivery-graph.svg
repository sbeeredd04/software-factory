<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">The continuous Software Factory cycle</title>
  <desc id="cycle-desc">Discover and prioritize, plan BMad epics and stories, build, review and test, ship and verify, then observe and improve the next cycle. Required proof gates remain. At any phase, risk, affected assets and agreed autonomy can require a human decision. Reserved checkpoints and actual permissions remain binding.</desc>
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#365a40" stroke-width="1.6"/></marker>
    <marker id="human-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a13f23" stroke-width="1.6"/></marker>
  </defs>
  <g id="factory-cycle" font-family="Inter, sans-serif" fill="#252820">
    <circle cx="320" cy="270" r="210" fill="none" stroke="#e0e4d8" stroke-width="2"/>
    <g fill="none" stroke="#365a40" stroke-width="2.3" marker-end="url(#cycle-arrow)">
      <path d="M385 70A210 210 0 0 1 459 116"/>
      <path d="M521 216A210 210 0 0 1 521 324"/>
      <path d="M459 424A210 210 0 0 1 420 452"/>
      <path d="M255 470A210 210 0 0 1 181 424"/>
      <path d="M119 324A210 210 0 0 1 119 216"/>
      <path d="M181 116A210 210 0 0 1 220 91"/>
    </g>
    <g text-anchor="middle" font-size="23">
      <rect x="228" y="18" width="184" height="84" rx="12" fill="#faf8f2" stroke="#b1b7a4"/>
      <text x="320" y="54">Discover</text><text x="320" y="82">+ prioritize</text>
      <rect x="410" y="123" width="184" height="84" rx="12" fill="#f0dfd3" stroke="#a13f23"/>
      <text x="502" y="159" font-weight="600">BMad epics</text><text x="502" y="187">+ stories</text>
      <rect x="410" y="333" width="184" height="84" rx="12" fill="#faf8f2" stroke="#b1b7a4"/>
      <text x="502" y="383">Build</text>
      <rect x="228" y="438" width="184" height="84" rx="12" fill="#e4eadd" stroke="#9ca990"/>
      <text x="320" y="474">Review</text><text x="320" y="502">+ test</text>
      <rect x="46" y="333" width="184" height="84" rx="12" fill="#e4eadd" stroke="#9ca990"/>
      <text x="138" y="369">Ship</text><text x="138" y="397">+ verify</text>
      <rect x="46" y="123" width="184" height="84" rx="12" fill="#faf8f2" stroke="#b1b7a4"/>
      <text x="138" y="159">Observe</text><text x="138" y="187">+ improve</text>
      <text x="320" y="261" font-size="32" font-weight="600">Keep</text>
      <text x="320" y="300" font-size="32" font-weight="600">shipping.</text>
    </g>
    <path d="M535 270H618V613H548" fill="none" stroke="#a13f23" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#human-arrow)"/>
    <text x="616" y="255" text-anchor="end" font-size="15" fill="#a13f23">ANY PHASE</text>
    <rect x="90" y="568" width="450" height="104" rx="12" fill="#faf8f2" stroke="#a13f23" stroke-dasharray="5 5"/>
    <text x="315" y="599" text-anchor="middle" font-size="23" fill="#a13f23">Human decision, when needed</text>
    <text x="315" y="627" text-anchor="middle" font-size="16">Risk · affected assets · agreed autonomy</text>
    <text x="315" y="651" text-anchor="middle" font-size="16">Decide, then resume the affected step.</text>
  </g>
</svg>
