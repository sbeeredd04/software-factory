    <text x="536" y="400" font-size="21" font-weight="600" fill="#365a40">Per story →</text>
    <text x="786" y="244" font-size="25" font-weight="600" fill="#252820">Integrate</text>
    <text x="786" y="280" font-size="25" font-weight="600" fill="#252820">+ deliver</text>
    <text x="786" y="317" font-size="21" fill="#252820">One merge owner</text>
    <text x="786" y="347" font-size="22" fill="#252820">SHA + behavior</text>
    <text x="786" y="400" font-size="19" fill="#252820">Approved authority</text>
