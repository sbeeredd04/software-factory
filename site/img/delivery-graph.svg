<text x="220" y="108" font-size="17">Independent plan review</text>
<rect x="50" y="148" width="340" height="48" rx="3" fill="#f0dfd3" stroke="#ba836c"/>
<text x="220" y="178" font-size="17">Scoped GO · ready frontier</text>
<rect x="34" y="234" width="156" height="58" rx="3" fill="#faf8f2" stroke="#b1b7a4"/>
<text x="112" y="258" font-size="17">Build + test</text><text x="112" y="278" font-size="12" fill="#5d6255">claimed worktree</text>
<rect x="250" y="234" width="156" height="58" rx="3" fill="#faf8f2" stroke="#b1b7a4"/>
<text x="328" y="258" font-size="17">Build + test</text><text x="328" y="278" font-size="12" fill="#5d6255">independent scope</text>
<rect x="50" y="331" width="340" height="48" rx="3" fill="#e4eadd" stroke="#9ca990"/>
<text x="220" y="351" font-size="16">Independent proof → integration</text><text x="220" y="369" font-size="12" fill="#365a40">actual diff · evals · effects</text>
