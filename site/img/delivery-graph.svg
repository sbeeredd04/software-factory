<svg xmlns="http://www.w3.org/2000/svg" width="440" height="502" viewBox="0 0 440 502" role="img" aria-labelledby="title desc">
<title id="title">One continuing delivery loop</title>
<desc id="desc">Intent is grounded and planned, then independently reviewed under scoped GO. Parallel build and test branches converge at an evidence gate and integration. Deployed identity and effect proof lead to a human epic checkpoint. Failed proof returns to corrective work. Authorized observations feed the next ready frontier.</desc>
