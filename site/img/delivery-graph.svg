    <rect x="1098" y="244" width="310" height="250" rx="8" fill="#e4eadd" stroke="#b1b7a4"/>
    <path d="M960 106V220H1253V237" fill="none" stroke="#365a40" stroke-width="2" marker-end="url(#green-arrow)"/>
    <path d="M334 362H375" fill="none" stroke="#365a40" stroke-width="2" marker-end="url(#green-arrow)"/>
