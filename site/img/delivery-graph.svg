    <text x="36" y="169" font-size="18" fill="#252820">Risk · assets · agreed autonomy → resume</text>
    <path d="M465 148H498V196" fill="none" stroke="#a13f23" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#rust-arrow)" marker-end="url(#rust-arrow)"/>
