    <text x="39" y="585" font-size="22" fill="#252820">Shared context · board · claims · receipts · decisions · checkpoints</text>
  </g>
  <g id="factory-system" transform="translate(0 660)" font-family="Inter, sans-serif" fill="#252820">
    <rect x="24" y="16" width="1392" height="90" rx="8" fill="#e4eadd" stroke="#9ca990"/>
    <text x="44" y="50" font-size="28" font-weight="600" fill="#252820">ACTIVE CODING HOST / ONE ORCHESTRATOR</text>
    <text x="44" y="86" font-size="23" fill="#252820">Own the ready frontier, staffing, claims, budgets, evidence, authority, status and recovery.</text>
    <rect x="24" y="125" width="870" height="72" rx="8" fill="#faf8f2" stroke="#a13f23" stroke-dasharray="6 5"/>
    <text x="44" y="155" font-size="21" font-weight="600" fill="#a13f23">Human decision · any phase, when risk or reserved authority requires it.</text>
    <text x="44" y="183" font-size="20" fill="#252820">Risk · assets · reversibility · agreed autonomy. Decide → resume affected work.</text>
    <path d="M894 160H930V220" fill="none" stroke="#a13f23" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#rust-arrow)" marker-end="url(#rust-arrow)"/>
